      /* ============================================================
         STATIC SHELL — branded loader + noscript SEO fallback.
         ============================================================
         The visible shell is now a small branded loader (logo + spinner).
         Rich SEO content is wrapped in <noscript> so it's only shown to

         ============================================================ */

      /* Reset + base */
      *{margin:0;padding:0;box-sizing:border-box}

      /* Shell container */
      #static-shell{display:block}
      #static-shell.ps-fadeout{opacity:0;pointer-events:none;transition:opacity 180ms ease-out}

      .ps-loader-spinner{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#1E3A8A;border-radius:50%;animation:ps-spin 0.85s linear infinite}

    <!-- SEO: On non-homepage routes, set document.title from the URL slug
               for a better initial crawl signal before React hydrates. -->
          <script>
            (function() {
              try {
                var path = window.location.pathname;
                if (path && path !== '/' && path !== '') {
                  var parts = path.replace(/\/$/, '').split('/').filter(Boolean);
                  var slug = parts[parts.length - 1] || '';
                  var decoded = slug
                    .replace(/039/g, "'")
                    .replace(/ampampamp/g, '&')
                    .replace(/ampamp/g, '&')
                    .replace(/amp/g, '&')
                    .replace(/-{2,}/g, ' - ')
                    .replace(/-/g, ' ')
                    .replace(/\b\w/g, function(c){ return c.toUpperCase(); });
                  if (decoded.length > 10) {
                    document.title = decoded + ' | Petshiwu';
                  }
                }
              } catch(e) {}
            })();
          </script>
          <!-- React mounts here; the static-shell fades out once #root has children -->
          <div id="root"></div>

          <!-- Fade the loader out smoothly when React mounts, then remove from DOM -->
          <script>
            (function() {
              var observer = new MutationObserver(function(mutations) {
                var root = document.getElementById('root');
                if (root && root.children.length > 0) {
                  var shell = document.getElementById('static-shell');
                  if (shell) {
                    shell.classList.add('ps-fadeout');
                    setTimeout(function() {
                      shell.style.display = 'none';
                      shell.setAttribute('aria-hidden', 'true');
                    }, 200);
                  }
                  observer.disconnect();
                }
              });
              observer.observe(document.getElementById('root') || document.body, {
                childList: true, subtree: true
              });
            })();
          </script>
