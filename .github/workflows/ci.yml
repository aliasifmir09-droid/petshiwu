name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install backend dependencies
      working-directory: backend
      run: bun install --frozen-lockfile

    - name: Install frontend dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile

    - name: Install admin dependencies
      working-directory: admin
      run: bun install --frozen-lockfile

    - name: Build backend
      working-directory: backend
      run: bun run build

    - name: Run backend tests
      working-directory: backend
      run: node ./node_modules/jest/bin/jest.js --coverage --runInBand
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/pet-ecommerce-test
        JWT_SECRET: test-jwt-secret-key-minimum-32-characters-long-for-testing

    - name: Build frontend
      working-directory: frontend
      run: bun run build

    - name: Build admin
      working-directory: admin
      run: bun run build

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install backend dependencies
      working-directory: backend
      run: bun install --frozen-lockfile

    - name: Install frontend dependencies
      working-directory: frontend
      run: bun install --frozen-lockfile

    - name: Install admin dependencies
      working-directory: admin
      run: bun install --frozen-lockfile

    - name: Check SEO route registries (frontend vs backend)
      run: bun scripts/check-seo-registries.ts

    - name: Check TypeScript (Backend)
      working-directory: backend
      run: bun run build

    - name: Check TypeScript (Frontend)
      working-directory: frontend
      run: bun run build

    - name: Check TypeScript (Admin)
      working-directory: admin
      run: bun run build
